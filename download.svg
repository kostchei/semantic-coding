<text x="1102" y="715" font-size="24" fill="#F2F7FF" font-weight="650">Weighted RRF</text>
<text x="1102" y="750" font-size="18" fill="#B8C8DC" font-weight="400">Merge ranked candidates</text>
<text x="1102" y="774" font-size="18" fill="#B8C8DC" font-weight="400">Deduplicate source chunks¹</text>
<text x="1102" y="798" font-size="18" fill="#B8C8DC" font-weight="400">Stable tie-breaking</text>
<text x="1102" y="822" font-size="18" fill="#B8C8DC" font-weight="400">Keep max(10, requested N)</text>
<text x="1102" y="860" font-size="15" fill="#5BDAC5" font-weight="600">Σ weight / (k + rank)</text>
