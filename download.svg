<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1540" viewBox="0 0 2000 1540" role="img" aria-labelledby="title desc">
<title id="title">How Semcode works: from repository to relevant code</title>
<desc id="desc">Architecture infographic showing Git-aware mirrored indexing, local text and code embeddings, project resolution, parallel dense retrieval, weighted reciprocal rank fusion, optional LLM reranking, source-linked results, telemetry, evaluation, prototype training, and operational support. Thick arrows indicate qualitative value added, not measured gains or ranking weights.</desc>
