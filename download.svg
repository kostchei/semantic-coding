<text x="1442" y="380" font-size="18" fill="#B8C8DC" font-weight="400">Manual index or eligible new-repo auto-index</text>
<text x="1442" y="404" font-size="18" fill="#B8C8DC" font-weight="400">Detached worker reports indexing status</text>
