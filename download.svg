<text x="60" y="64" font-size="18" fill="#5BDAC5" font-weight="700">SEMCODE  /  SYSTEM FLOW</text>
<text x="60" y="124" font-size="46" fill="#F2F7FF" font-weight="700">From “where is it?” to the code that matters.</text>
<text x="60" y="165" font-size="23" fill="#B8C8DC" font-weight="400">Two complementary embedding models • local retrieval • one ranked set of source evidence</text>
<path d="M60 209 H125" fill="none" stroke="#7389A3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a7389A3)"/>
<text x="140" y="216" font-size="17" fill="#B8C8DC" font-weight="400">Plumbing</text>
<path d="M300 209 H365" fill="none" stroke="#5BDAC5" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a5BDAC5)"/>
<text x="380" y="216" font-size="17" fill="#B8C8DC" font-weight="400">Core value added</text>
<path d="M605 209 H670" fill="none" stroke="#AD9AFF" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#aAD9AFF)" stroke-dasharray="9 9"/>
<text x="685" y="216" font-size="17" fill="#B8C8DC" font-weight="400">Optional / offline</text>
<text x="1070" y="216" font-size="18" fill="#91A6BF" font-weight="400">Arrow strength is qualitative, not a measured gain or model weight.</text>
<text x="60" y="278" font-size="18" fill="#5BDAC5" font-weight="700">01  BUILD &amp; REFRESH THE SEARCHABLE MEMORY</text>
<rect x="60" y="305" width="270" height="185" rx="18" fill="#142337" stroke="#31465E"/>
<rect x="60" y="327" width="4" height="30" rx="2" fill="#5BDAC5"/>
<text x="82" y="345" font-size="24" fill="#F2F7FF" font-weight="650">Source repository</text>
<text x="82" y="380" font-size="18" fill="#B8C8DC" font-weight="400">Tracked + untracked files</text>
<text x="82" y="404" font-size="18" fill="#B8C8DC" font-weight="400">Git ignores respected</text>
<text x="82" y="428" font-size="18" fill="#B8C8DC" font-weight="400">Agent folders, submodules</text>
<text x="82" y="452" font-size="18" fill="#B8C8DC" font-weight="400">and worktrees excluded</text>
<text x="82" y="470" font-size="15" fill="#5BDAC5" font-weight="600">semcode/indexer.py</text>
<rect x="390" y="305" width="270" height="185" rx="18" fill="#142337" stroke="#31465E"/>
<rect x="390" y="327" width="4" height="30" rx="2" fill="#5BDAC5"/>
<text x="412" y="345" font-size="24" fill="#F2F7FF" font-weight="650">Clean dual mirrors</text>
<text x="412" y="380" font-size="18" fill="#B8C8DC" font-weight="400">repo-text + repo-code</text>
<text x="412" y="404" font-size="18" fill="#B8C8DC" font-weight="400">Copies outside the source</text>
<text x="412" y="428" font-size="18" fill="#B8C8DC" font-weight="400">Add / change / delete sync</text>
<text x="412" y="470" font-size="15" fill="#5BDAC5" font-weight="600">indexer.py · sync.py</text>
<rect x="720" y="305" width="300" height="185" rx="18" fill="#142337" stroke="#31465E"/>
<rect x="720" y="327" width="4" height="30" rx="2" fill="#5BDAC5"/>
<text x="742" y="345" font-size="24" fill="#F2F7FF" font-weight="650">grepai + LM Studio</text>
<text x="742" y="380" font-size="18" fill="#B8C8DC" font-weight="400">Chunk source: 300 / 50 overlap</text>
<text x="742" y="404" font-size="18" fill="#B8C8DC" font-weight="400">Text: 137M → 768 dimensions</text>
<text x="742" y="428" font-size="18" fill="#B8C8DC" font-weight="400">Code: 7B → 4096 dimensions</text>
<text x="742" y="470" font-size="15" fill="#5BDAC5" font-weight="600">Initial indexing: text, then code</text>
<rect x="1080" y="305" width="270" height="185" rx="18" fill="#142337" stroke="#31465E"/>
<rect x="1080" y="327" width="4" height="30" rx="2" fill="#5BDAC5"/>
<text x="1102" y="345" font-size="24" fill="#F2F7FF" font-weight="650">Two vector stores</text>
<text x="1102" y="380" font-size="18" fill="#B8C8DC" font-weight="400">Separate .grepai/index.gob</text>
<text x="1102" y="404" font-size="18" fill="#B8C8DC" font-weight="400">One store for each model</text>
<text x="1102" y="428" font-size="18" fill="#B8C8DC" font-weight="400">Registry maps source → stores</text>
<text x="1102" y="470" font-size="15" fill="#5BDAC5" font-weight="600">Local files · registry.py</text>
